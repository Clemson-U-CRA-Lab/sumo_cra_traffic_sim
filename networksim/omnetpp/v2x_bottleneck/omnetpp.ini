[General]
network = v2x_bottleneck.V2XBottleneckNetwork
sim-time-limit = 60s

cmdenv-express-mode = false
cmdenv-event-banners = false

# Output recording
**.scalar-recording = true
**.vector-recording = true

# IPv4 auto-configuration
*.configurator.addStaticRoutes = true

# -------------------------
# Vehicle receiver
# -------------------------
*.vehicle.numApps = 1
*.vehicle.app[0].typename = "UdpSink"
*.vehicle.app[0].localPort = 5000

# -------------------------
# Normal RSU -> Vehicle traffic
# 10 Hz, 300 byte messages
# -------------------------
*.rsu.numApps = 1
*.rsu.app[0].typename = "UdpBasicApp"
*.rsu.app[0].destAddresses = "vehicle"
*.rsu.app[0].destPort = 5000
*.rsu.app[0].messageLength = 300B
*.rsu.app[0].sendInterval = 100ms
*.rsu.app[0].startTime = 1s
*.rsu.app[0].stopTime = 60s


# ==========================================================
# Scenario 1: Baseline, no attacker
# ==========================================================
[Config Baseline]
description = "Normal RSU-to-vehicle UDP traffic with no attacker"

*.attacker.numApps = 0


# ==========================================================
# Scenario 2: Low-rate UDP attack
# ==========================================================
[Config LowAttack]
description = "Low-rate UDP attacker traffic during 20s-40s"

*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpBasicApp"
*.attacker.app[0].destAddresses = "vehicle"
*.attacker.app[0].destPort = 5000
*.attacker.app[0].messageLength = 300B
*.attacker.app[0].sendInterval = 10ms
*.attacker.app[0].startTime = 20s
*.attacker.app[0].stopTime = 40s


# ==========================================================
# Scenario 3: High-rate UDP attack
# ==========================================================
[Config HighRateAttack]
description = "High packet-rate UDP flooding during 20s-40s"

*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpBasicApp"
*.attacker.app[0].destAddresses = "vehicle"
*.attacker.app[0].destPort = 5000
*.attacker.app[0].messageLength = 300B
*.attacker.app[0].sendInterval = 1ms
*.attacker.app[0].startTime = 20s
*.attacker.app[0].stopTime = 40s


# ==========================================================
# Scenario 4: Oversized-payload attack
# ==========================================================
[Config OversizedAttack]
description = "Large-payload UDP attack during 20s-40s"

*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpBasicApp"
*.attacker.app[0].destAddresses = "vehicle"
*.attacker.app[0].destPort = 5000
*.attacker.app[0].messageLength = 1500B
*.attacker.app[0].sendInterval = 1ms
*.attacker.app[0].startTime = 20s
*.attacker.app[0].stopTime = 40s


# ==========================================================
# Scenario 5: Stress attack
# ==========================================================
[Config StressAttack]
description = "Very high-rate oversized UDP attack during 20s-40s"

*.attacker.numApps = 1
*.attacker.app[0].typename = "UdpBasicApp"
*.attacker.app[0].destAddresses = "vehicle"
*.attacker.app[0].destPort = 5000
*.attacker.app[0].messageLength = 1500B
*.attacker.app[0].sendInterval = 100us
*.attacker.app[0].startTime = 20s
*.attacker.app[0].stopTime = 40s
