[General]
abstract = true
sim-time-limit=20s
**.routingRecorder.enabled = false

############### Statistics ##################
output-scalar-file = ${resultdir}/${configname}/${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${repetition}.vec
seed-set = ${repetition}
**.vector-recording = true

################ Mobility parameters #####################
# *

**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

############### Number of Resource Blocks ################
**.numBands = 50 # this value should be kept equal to the number of RBs

############### Transmission Power ##################
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

############### IPv4 configurator config #################
*.configurator.config = xmldoc("./demo.xml")


#------------------------------------#
# Config Standalone
#
# Topology configuration for the exemplary scenario for NR Standalone deployment
#
[Config Standalone]
network = simu5g.simulations.nr.networks.SingleCell_Standalone
sim-time-limit=20s

############### e/gNodeB configuration #################
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

############## UE configuration ##################
*.numUe = 1

# connect the UE's NIC to the corresponding serving gNB (NR side only)
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

# UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m
#------------------------------------#



#------------------------------------#
# Config VoIP-DL
#
# General configuration for Voice-over-IP DL traffic to the UE
#
[Config VoIP-DL]
extends=Standalone

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.ue[*].app[*].typename = "VoipReceiver"
*.ue[*].app[0].localPort = 3000

*.server.app[*].packetSize = 40B
*.server.app[*].destAddress = "ue[0]" # obtain the address of the client by reading its index in the array of udp Apps
*.server.app[*].localPort = 3088+ancestorIndex(0)
*.server.app[*].typename = "VoipSender"
*.server.app[*].startTime = uniform(0s,0.02s)
#------------------------------------#



#------------------------------------#
# Config VoIP-UL
#
# General configuration for Voice-over-IP UL traffic from the UE
#
[Config VoIP-UL]
extends=Standalone

# one UDP application for each user
*.ue[*].numApps = 1

# the amount of UDP applications on server should be equal to (numUEs)*(ue[*].numApps)
*.server.numApps = 1

#============= Application Setup =============
*.server.app[*].typename = "VoipReceiver"
*.server.app[*].localPort = 3000+ancestorIndex(0)

*.ue[*].app[*].packetSize = 40B
# obtain the address of the client by reading its index in the array of udp Apps
*.ue[*].app[*].destAddress = "server"
*.ue[*].app[*].localPort = 3088+ancestorIndex(0)
*.ue[*].app[*].typename = "VoipSender"
*.ue[*].app[*].startTime = uniform(0s,0.02s)
#------------------------------------#




#------------------------------------#
# Config Nv0TraceUL
#
# Limited-capacity proxy for current SUMO/Python nv0 -> nv1 status messages.
# ue[0] acts as nv0 sender proxy.
# server acts as receiver/logger proxy.
#
[Config Nv0TraceUL]
extends=VoIP-UL
description = "nv0 status-message proxy: 300B packets using Simu5G uplink"

sim-time-limit = 80s

# Match current Python/SUMO message stream
*.ue[*].app[*].packetSize = 300B
*.ue[*].app[*].startTime = 0.2s

# Save outputs outside the copied example folder
output-scalar-file = ../../output/Nv0TraceUL.sca
output-vector-file = ../../output/Nv0TraceUL.vec
#------------------------------------#


#------------------------------------#
# Config Nv0CBR_UL_ActualUeAttack
#
# Model-generated attack scenario using actual Simu5G UE traffic.
# ue[0] is the target nv0 proxy flow.
# ue[1..15] are attacker UEs generating uplink CBR traffic.
# Delay/drop are NOT manually assigned; they are Simu5G outputs.
#
[Config Nv0CBR_UL_ActualUeAttack]
extends = Standalone
description = "Target nv0 proxy uplink under actual Simu5G attacker UE uplink traffic"

sim-time-limit = 80s

# Save outputs to project output folder
output-scalar-file = ../../output/actual_ue_attack_sweep/${iterationvars}.sca
output-vector-file = ../../output/actual_ue_attack_sweep/${iterationvars}.vec

# Record vectors so target-flow delay can be extracted
**.vector-recording = true

# One target UE + 15 attacker UEs
*.numUe = 16

# Connect all UEs to the same serving gNB
*.ue[*].servingNodeId = 0
*.ue[*].nrServingNodeId = 1

# Target UE position
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

# Attacker UE positions around the same cell
*.ue[1..15].mobility.initialX = uniform(400m,500m)
*.ue[1..15].mobility.initialY = uniform(300m,400m)

# Each UE has one CBR sender app
*.ue[*].numApps = 1

# Server has two receiver apps:
# app[0] receives the target nv0 proxy flow
# app[1] receives attacker traffic
*.server.numApps = 2

*.server.app[0].typename = "CbrReceiver"
*.server.app[0].localPort = 3000

*.server.app[1].typename = "CbrReceiver"
*.server.app[1].localPort = 3001

# All UEs send to the server
*.ue[*].app[0].typename = "CbrSender"
*.ue[*].app[0].destAddress = "server"

# Target nv0 proxy flow: match SUMO message stream
*.ue[0].app[0].packetSize = 300B
*.ue[0].app[0].samplingTime = 0.1s
*.ue[0].app[0].destPort = 3000
*.ue[0].app[0].startTime = 0.2s
*.ue[0].app[0].finishTime = 79.9s

# Attacker UE uplink traffic:
# These are network offered-load inputs, not delay/drop outputs.
*.ue[1..15].app[0].packetSize = ${attackerMsgLen=1000B,5000B,10000B}
*.ue[1..15].app[0].samplingTime = ${attackerPeriod=0.01s,0.005s,0.001s}
*.ue[1..15].app[0].destPort = 3001

# Attack window: attacker traffic is active only during this period.
# This defines when the network attack happens, not the resulting delay/drop.
*.ue[1..15].app[0].startTime = 20s
*.ue[1..15].app[0].finishTime = 55s
#------------------------------------#


